[pytest]
testpaths = tests
markers =
    gpu: needs an NVIDIA GPU, the worker venv and downloaded weights
    slow: long-running benchmark (run with -m slow)
    nuke: runs tests/nuke_tests inside headless Nuke (needs a Nuke licence)
addopts = -m "not slow"
norecursedirs = nuke_tests fixtures _out .venv vendor
